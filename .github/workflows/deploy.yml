name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 8m
          script: |
            set -e
            
            # Directory where aronno is deployed on the VPS
            DEPLOY_DIR="/root/aronno"
            
            echo "==> Deploying to $DEPLOY_DIR..."
            
            # Create directory if it doesn't exist
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Check if it is a git repo, if not clone it
            if [ ! -d ".git" ]; then
              echo "==> Initializing deployment directory..."
              git clone https://github.com/murschid/aronno.git .
            else
              echo "==> Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Build and deploy the separate container
            echo "==> Building container..."
            docker compose build --pull

            echo "==> Deploying container..."
            docker compose up -d --force-recreate --remove-orphans

            echo "==> Cleaning up dangling docker images..."
            docker image prune -f

            # Smoke test to verify site is healthy
            echo "==> Running smoke tests..."
            sleep 5
            curl -sfL --retry 3 --retry-delay 5 https://aronno.net > /dev/null && echo "  ✓ aronno.net is UP and running!" || { echo "  ✗ aronno.net smoke test FAILED"; exit 1; }

            echo "==> Deployment complete!"
